name: Build SUSE Image

on:
  push:
    branches: [rancher-main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: '.go-version'
          cache: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Build with goreleaser (snapshot)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/rancher-main'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          goreleaser build --snapshot --clean

          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_BASE="${{ env.REGISTRY }}/${{ github.repository }}:dev-${SHORT_SHA}"

          # Build Docker images for both architectures
          for arch in amd64 arm64; do
            if [ "$arch" = "amd64" ]; then
              binary_path="dist/logging-operator_linux_amd64_v1/logging-operator"
            else
              binary_path="dist/logging-operator_linux_arm64/logging-operator"
            fi

            if [ -f "$binary_path" ]; then
              cp "$binary_path" ./logging-operator
              docker buildx build \
                --platform linux/$arch \
                -f Dockerfile.suse \
                -t "${TAG_BASE}-${arch}" \
                ${{ github.event_name != 'pull_request' && '--push' || '--load' }} \
                .
              rm -f logging-operator
            fi
          done

          # Compose a multi-arch manifest list at the unsuffixed dev tag so
          # the chart can reference a single tag. Skipped for PRs because the
          # per-arch images are only --load'ed locally and not pushed.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker buildx imagetools create \
              --tag "${TAG_BASE}" \
              "${TAG_BASE}-amd64" \
              "${TAG_BASE}-arm64"
          fi

      - name: Build release with goreleaser
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          goreleaser release --clean
