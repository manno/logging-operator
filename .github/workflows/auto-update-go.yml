name: Auto-Update Go

on:
  schedule:
    - cron: '7 10 * * *'  # Daily at 10:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: rancher-main

      - name: Check Go version
        id: check
        run: |
          set -euo pipefail

          LATEST=$(curl -fsSL 'https://go.dev/dl/?mode=json' | \
                   jq -r '[.[] | select(.stable == true)] | .[0].version' | \
                   sed 's/go//')
          CURRENT=$(cat .go-version)

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update .go-version and go.mod toolchain
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          LATEST="${{ steps.check.outputs.latest }}"

          # CI reads this file via actions/setup-go
          echo "${LATEST}" > .go-version

          # Local devs with Go 1.21+ auto-download via toolchain directive
          if grep -q "^toolchain " go.mod; then
            sed -i "s/^toolchain go.*/toolchain go${LATEST}/" go.mod
          else
            # Insert toolchain directive after the go directive
            sed -i "/^go [0-9]/a toolchain go${LATEST}" go.mod
          fi

      - name: Create or update PR
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          set -euo pipefail

          BRANCH="auto-update-go-${LATEST}"
          TITLE="chore: update Go to ${LATEST}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${BRANCH}"

          git add .go-version go.mod
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "${TITLE}"
          git push -f origin "${BRANCH}"

          cat > pr-body.md <<EOF
          ## Automated Go Compiler Update

          - **Previous**: \`${CURRENT}\`
          - **New**: \`${LATEST}\`

          Rebuilding with the new Go compiler picks up Go stdlib security fixes.

          ### Files Updated
          - \`.go-version\` — used by \`actions/setup-go\` in CI
          - \`go.mod\` — \`toolchain\` directive, auto-downloaded by local devs

          ### Release Notes
          https://go.dev/doc/devel/release#go${LATEST}

          ---
          🤖 Generated by [auto-update-go](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          EXISTING=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" \
              --title "${TITLE}" \
              --body-file pr-body.md
            echo "Updated existing PR #${EXISTING}"
          else
            gh pr create \
              --title "${TITLE}" \
              --body-file pr-body.md \
              --base rancher-main \
              --head "${BRANCH}" \
              --label "dependencies" \
              --label "automated" \
              --label "go-update"
          fi
